[package]
name = "gta_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.29", features = ["rwh_05"] }
wgpu = "0.20"
glam = "0.27"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
gta_render = { path = "../gta_render" }
gta_physics = { path = "../gta_physics" }
gta_gameplay = { path = "../gta_gameplay" }
gta_assets = { path = "../gta_assets" }

